name: Create Glow for Facebook app

on:
  workflow_dispatch:
    inputs:

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "Facebook"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.facebook.Facebook"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sanitized Glow IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@15951963797b16aa43fa0b093b45cd2db0319fdd  # 1.2.0
        with:
          exclude_inputs: display_name,bundle_id

      - name: Download and validate IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          wget "$IPA_URL" --no-verbose -O "${{ github.workspace }}/facebook.ipa"

          file_type=$(file --mime-type -b "${{ github.workspace }}/facebook.ipa")

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Download Glow for Facebook
        id: download_glow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/dayanch96/Glow/releases/latest"

          # Workaround
          curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "$api_url" > /dev/null

          response=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "$api_url")
          tag_name=$(echo "$response" | jq -r '.tag_name')
          deb_url=$(echo "$response" | jq -r '.assets[0].browser_download_url')

          if [[ "$deb_url" == "null" || -z "$deb_url" ]]; then
            echo "::error::Failed to get tweak URL from Github API"
            exit 1
          fi

          echo "GLOW_TAG=$tag_name" >> "$GITHUB_ENV"
          echo "Downloading: $deb_url"
          wget "$deb_url" --no-verbose -O "${{ github.workspace }}/glow_fb.deb"

      - name: Inject tweaks into IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: cyan -i facebook.ipa -o "Glow_FB_${GLOW_TAG}.ipa" -uwef glow_fb.deb -n "$DISPLAY_NAME" -b "$BUNDLE_ID" -s

      - name: Strip embedded Swift dylibs
        run: |
          set -euo pipefail
          unzip -q "Glow_FB_${GLOW_TAG}.ipa" -d tmp_payload
          find tmp_payload/Payload/*.app/ -name "libswift*.dylib" -print -delete
          cd tmp_payload
          zip -qr "../Glow_FB_${GLOW_TAG}_clean.ipa" Payload
          cd ..
          mv "Glow_FB_${GLOW_TAG}_clean.ipa" "Glow_FB_${GLOW_TAG}.ipa"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: glow-fb-${{ env.GLOW_TAG }}
          name: Glow_FB ${{ env.GLOW_TAG }}
          files: Glow_FB_${{ env.GLOW_TAG }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
