name: Sync Fork From Upstream

on:
  schedule:
    - cron: "31 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: dayanch96/Glow
  DOWNSTREAM_BRANCH: main

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      changed: ${{ steps.candidate.outputs.changed }}
      conflict: ${{ steps.candidate.outputs.conflict }}
      conflicts-b64: ${{ steps.candidate.outputs.conflicts_b64 }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Resolve and reconstruct the candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            if git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" main; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((2 ** (attempt - 1)))
          done
          upstream=$(git rev-parse FETCH_HEAD)
          changed=true; conflict=false; conflicts=""; conflicts_b64=""; tree=""
          if git merge-base --is-ancestor "$upstream" "$base"; then
            changed=false
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            set +e; git merge --no-edit "$upstream"; status=$?; set -e
            if [[ "$status" -ne 0 ]]; then
              changed=false; conflict=true
              conflicts=$(git diff --name-only --diff-filter=U | head -50)
              conflicts_b64=$(printf '%s' "$conflicts" | base64 | tr -d '\n')
              git merge --abort
            else
              tree=$(git rev-parse 'HEAD^{tree}')
            fi
          fi
          {
            echo "base=$base"; echo "upstream=$upstream"; echo "changed=$changed"
            echo "conflict=$conflict"; echo "tree=$tree"
            echo "conflicts_b64=$conflicts_b64"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}
      - name: Validate exact candidate without credentials
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          for attempt in 1 2 3; do
            if git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((2 ** (attempt - 1)))
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          scripts/validate-downstream.sh

  finalize:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base }}
      - name: Publish exact validated tree without executing it
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git ls-remote origin "refs/heads/${DOWNSTREAM_BRANCH}" | awk '{print $1}')
          test "$actual" = "$BASE_SHA"
          for attempt in 1 2 3; do
            if git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((2 ** (attempt - 1)))
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          expected_parents=$(git show -s --format=%P HEAD)
          [[ "$expected_parents" =~ ^[0-9a-f]{40}(\ [0-9a-f]{40})*$ ]]
          branch="automation/upstream-sync-${UPSTREAM_SHA}-${BASE_SHA}"
          existing=$(gh pr list --head "$branch" --base "$DOWNSTREAM_BRANCH" --state open \
            --json url,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].url // empty')
          if [[ -n "$existing" ]]; then
            existing_base=$(gh pr view "$existing" --json baseRefOid --jq .baseRefOid)
            existing_head=$(gh pr view "$existing" --json headRefOid --jq .headRefOid)
            existing_cross_repo=$(gh pr view "$existing" --json isCrossRepository --jq .isCrossRepository)
            [[ "$existing_base" =~ ^[0-9a-f]{40}$ && "$existing_head" =~ ^[0-9a-f]{40}$ ]]
            test "$existing_cross_repo" = "false"
            test "$existing_base" = "$BASE_SHA"
            origin_head=$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')
            test "$origin_head" = "$existing_head"
            git fetch --no-tags origin "$existing_head"
            test "$(git rev-parse "${existing_head}^{tree}")" = "$EXPECTED_TREE"
            test "$(git show -s --format=%P "$existing_head")" = "$expected_parents"
            echo "Existing synchronization PR: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          published_head=$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ -n "$published_head" ]]; then
            [[ "$published_head" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$published_head"
            test "$(git rev-parse "${published_head}^{tree}")" = "$EXPECTED_TREE"
            test "$(git show -s --format=%P "$published_head")" = "$expected_parents"
          else
            git push --set-upstream origin "HEAD:refs/heads/$branch"
            published_head=$(git rev-parse HEAD)
          fi
          url=$(gh pr create --head "$branch" --base "$DOWNSTREAM_BRANCH" \
            --title "chore: sync dayanch96/Glow main" \
            --body "Merges \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\`. Validated base: \`${BASE_SHA}\`.")
          pr_base=$(gh pr view "$url" --json baseRefOid --jq .baseRefOid)
          pr_head=$(gh pr view "$url" --json headRefOid --jq .headRefOid)
          if [[ "$pr_base" != "$BASE_SHA" ]]; then
            gh pr close "$url" --delete-branch --comment "Closed automatically because the base branch advanced after validation."
            exit 1
          fi
          if [[ "$pr_head" != "$published_head" ]]; then
            gh pr close "$url" --comment "Closed automatically because the review branch changed after the validated commit was published."
            exit 1
          fi

  report-conflict:
    needs: prepare
    if: needs.prepare.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      CONFLICTS_B64: ${{ needs.prepare.outputs.conflicts-b64 }}
    steps:
      - name: Record merge conflict
        shell: bash
        run: |
          set -euo pipefail
          conflicts=$(printf '%s' "$CONFLICTS_B64" | base64 --decode)
          title="Glow upstream sync conflict"
          body_file="$RUNNER_TEMP/glow-upstream-conflict.md"
          # Markdown backticks are intentionally literal.
          # shellcheck disable=SC2016
          printf 'The review merge stopped without changing `%s`.\n\n- Upstream: `%s@%s`\n\n```text\n%s\n```\n' \
            "$DOWNSTREAM_BRANCH" "$UPSTREAM_REPOSITORY" "$UPSTREAM_SHA" "$conflicts" > "$body_file"
          issue_number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$issue_number" ]]; then gh issue comment "$issue_number" --body-file "$body_file"; else gh issue create --title "$title" --body-file "$body_file"; fi
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          exit 1
